<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RPG</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
         <script src="{{ url_for('static', filename='js/script.js') }}"defer></script>
</head>
<body>
    <main class="container">
        <h1>Rolagem de dados</h1>

        <div class="scene">
            <div class="dado" id="dado">
                <div class="face frente">1</div>
                <div class="face tras">6</div>
                <div class="face direita">2</div>
                <div class="face esquerda">5</div>
                <div class="face topo">3</div>
                <div class="face base">4</div>
            </div>
        </div>

        <button id="rolar" type="button">Rolar dado</button>
</body>
</html>
